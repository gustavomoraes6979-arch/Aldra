<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AdminIA</title>

  <!-- Usa o mesmo CSS do sistema -->
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <div class="auth-container card fade-in" style="max-width:360px; margin:60px auto; padding:30px;">
    <h2 style="text-align:center; margin-bottom:20px;">Entrar no AdminIA</h2>

    <form id="loginForm" class="col">

      <label class="help">E-mail</label>
      <input type="email" id="email" placeholder="Seu e-mail" required />

      <label class="help" style="margin-top:10px;">Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required />

      <button type="submit" class="btn btn-primary" style="margin-top:20px; width:100%;">
        Entrar
      </button>
    </form>

    <p id="msg" class="help" style="margin-top:16px; text-align:center;"></p>

    <p style="text-align:center; margin-top:12px;">
      Ainda não tem conta?
      <a href="/register.html">Registrar</a>
    </p>
  </div>

  <!-- Script de login -->
  <script src="/js/login.js"></script>

</body>
</html>
