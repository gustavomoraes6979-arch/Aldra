<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<title>Aldra — Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f7fa;
}

header{
background:#111;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:12px;
border-bottom:1px solid #ddd;
}

th{
background:#f1f4f8;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
cursor:pointer;
}

.btn-approve{
background:#27ae60;
color:white;
}

.btn-logout{
background:#e74c3c;
color:white;
}

</style>

</head>

<body>

<header>
<h2>🔐 Painel Administrativo Aldra</h2>
<button class="btn-logout" onclick="logout()">Sair</button>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Usuários</h3>
<p id="metricUsers">0</p>
</div>

<div class="card">
<h3>Assinaturas Ativas</h3>
<p id="metricActive">0</p>
</div>

<div class="card">
<h3>Receita Mensal</h3>
<p id="metricRevenue">R$ 0</p>
</div>

<div class="card">
<h3>Pagamentos Pendentes</h3>
<p id="metricPending">0</p>
</div>

</div>

<h3>👥 Usuários</h3>

<table>

<thead>
<tr>
<th>Nome</th>
<th>Email</th>
<th>Status</th>
<th>Pagamento</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="usersTable"></tbody>

</table>

</div>

<script>

const token = localStorage.getItem("token");

/* =========================
VERIFICA TOKEN
========================= */

if(!token){

alert("Sessão expirada. Faça login novamente.");

window.location.href="/";

}

/* =========================
LOGOUT
========================= */

function logout(){

localStorage.removeItem("token");
window.location.href="/";

}

/* =========================
CARREGAR MÉTRICAS
========================= */

async function carregarMetricas(){

try{

const res = await fetch("/admin/metrics",{

headers:{
Authorization:"Bearer "+token
}

});

const data = await res.json();

document.getElementById("metricUsers").innerText = data.users || 0;
document.getElementById("metricActive").innerText = data.active || 0;
document.getElementById("metricRevenue").innerText = "R$ "+(data.revenue || 0);
document.getElementById("metricPending").innerText = data.pending || 0;

}catch(err){

console.error("Erro métricas",err);

}

}

/* =========================
CARREGAR USUÁRIOS
========================= */

async function carregarUsuarios(){

try{

const res = await fetch("/admin/users",{

headers:{
Authorization:"Bearer "+token
}

});

const users = await res.json();

const tbody = document.getElementById("usersTable");
tbody.innerHTML="";

users.forEach(u=>{

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${u.nome || ""}</td>
<td>${u.email}</td>
<td>${u.status || "inativo"}</td>
<td>${u.pagamento_status || "-"}</td>
<td>
<button class="btn-approve" onclick="aprovar(${u.id})">
Aprovar
</button>
</td>

`;

tbody.appendChild(tr);

});

}catch(err){

console.error("Erro usuários",err);

}

}

/* =========================
APROVAR ASSINATURA
========================= */

async function aprovar(id){

try{

await fetch("/admin/approve/"+id,{

method:"POST",

headers:{
Authorization:"Bearer "+token
}

});

carregarUsuarios();
carregarMetricas();

}catch(err){

console.error("Erro aprovação",err);

}

}

/* =========================
INICIAR
========================= */

carregarMetricas();
carregarUsuarios();

</script>

</body>
</html>
