<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM - Aldra</title>

  <link rel="stylesheet" href="/css/style.css">

  <style>
    body {
      padding: 20px;
      background: #f5f6ff;
      font-family: Arial, sans-serif;
    }

    h1, h2, h3 {
      margin-bottom: 10px;
      color: #222;
    }

    .card {
      background: #ffffff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    input, select, textarea {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      background: #4a53ff;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .btn-danger { background: #b83232; }
    .btn-ghost  { background: #666; }
    .btn-ghost:hover { background: #444; }
    button:hover { filter: brightness(0.95); }

    #clients .card { border-left: 4px solid #4a53ff; }

    #backBtn { background: #333; margin-bottom: 20px; }
    #backBtn:hover { background: #000; }

    #crmMsg { font-size: 14px; margin-top: 5px; }

    .summary {
      margin-top: 12px;
      padding: 12px;
      background: #f7f9ff;
      border-radius: 8px;
      border: 1px dashed #dfe7ff;
      white-space: pre-wrap;
    }

    .client-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small {
      padding: 6px 8px;
      font-size: 13px;
    }

    /* MODAL */
    .modal-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      background: white;
      width: 90%;
      max-width: 450px;
      padding: 20px;
      border-radius: 10px;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* TIMELINE */
    .timeline {
      margin-top: 15px;
      padding-left: 15px;
      border-left: 3px solid #4a53ff;
    }

    .timeline-item {
      margin-bottom: 12px;
      padding: 8px;
      background: #f1f3ff;
      border-radius: 6px;
      font-size: 14px;
    }

    /* TAREFAS */
    .task-item {
      background: #fff7db;
      border-left: 4px solid #ffce3a;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>



<body>

  <h1>CRM — Clientes</h1>

  <!-- Verificação de login -->
  <script>
    const tk = localStorage.getItem("token");
    if (!tk) window.location.href = "/login";
  </script>

  <button id="backBtn" onclick="window.location.href='/dashboard'">← Voltar ao Dashboard</button>



  <!-- FORMULÁRIO DE NOVO CLIENTE -->
  <div class="card">
    <h3>Novo Cliente</h3>

    <input id="cName" placeholder="Nome do cliente" required>
    <input id="cEmail" placeholder="E-mail">
    <input id="cPhone" placeholder="Telefone">

    <select id="cStatus">
      <option value="lead">Lead</option>
      <option value="negociando">Negociando</option>
      <option value="cliente">Cliente</option>
    </select>

    <textarea id="cNotes" placeholder="Notas (opcional)"></textarea>

    <button id="saveBtn" onclick="createClient()">Salvar Cliente</button>
    <p id="crmMsg"></p>
  </div>



  <hr>

  <h2>Lista de Clientes</h2>
  <div id="clients"></div>



  <!-- MODAL — EDIÇÃO -->
  <div id="editModal" class="modal-bg">
    <div class="modal-box">
      <h3>Editar Cliente</h3>

      <input id="eName" placeholder="Nome do cliente">
      <input id="eEmail" placeholder="E-mail">
      <input id="ePhone" placeholder="Telefone">

      <select id="eStatus">
        <option value="lead">Lead</option>
        <option value="negociando">Negociando</option>
        <option value="cliente">Cliente</option>
      </select>

      <textarea id="eNotes" placeholder="Notas"></textarea>

      <button onclick="saveEdit()">Salvar Alterações</button>
      <button class="btn-ghost" onclick="closeEdit()">Cancelar</button>

      <input type="hidden" id="editId">
    </div>
  </div>



  <!-- MODAL — HISTÓRICO -->
  <div id="timelineModal" class="modal-bg">
    <div class="modal-box">
      <h3>Histórico do Cliente</h3>

      <div id="timelineContent" class="timeline"></div>

      <textarea id="timelineNewEntry" placeholder="Adicionar evento ao histórico..."></textarea>

      <button onclick="addTimelineEntry()">Adicionar ao Histórico</button>
      <button class="btn-ghost" onclick="closeTimeline()">Fechar</button>

      <input type="hidden" id="timelineClientId">
    </div>
  </div>



  <!-- MODAL — TAREFAS -->
  <div id="tasksModal" class="modal-bg">
    <div class="modal-box">
      <h3>Tarefas do Cliente</h3>

      <div id="tasksList"></div>

      <textarea id="taskText" placeholder="Descrição da tarefa..."></textarea>
      <input type="date" id="taskDate">

      <button onclick="createTask()">Adicionar Tarefa</button>
      <button class="btn-ghost" onclick="closeTasks()">Fechar</button>

      <input type="hidden" id="taskClientId">
    </div>
  </div>


  <script src="/js/crm.js"></script>
</body>
</html>
