<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM - Aldra</title>

  <style>
    body {
      padding: 20px;
      background: #f5f6ff;
      font-family: Arial, sans-serif;
    }

    h1, h2, h3 { color: #222; }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 6px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    input, select, textarea {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      padding: 10px 14px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #4a53ff;
      color: #fff;
      font-weight: bold;
    }

    .btn-danger { background: #c0392b; }
    .btn-ghost { background: #777; }
    .btn-ai { background: #16a085; }

    #clients .card { border-left: 4px solid #4a53ff; }
    #crmMsg { font-size: 14px; margin-top: 6px; }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>📊 CRM — Aldra</h1>

<script>
  const token = localStorage.getItem("token");
  if (!token) location.href = "/";
</script>

<button onclick="location.href='/dashboard.html'">← Voltar</button>

<!-- NOVO CLIENTE -->
<div class="card">
  <h3>Novo Cliente</h3>

  <input id="cName" placeholder="Nome do cliente">
  <input id="cEmail" placeholder="E-mail">
  <input id="cPhone" placeholder="Telefone">

  <select id="cStatus">
    <option value="lead">Lead</option>
    <option value="negociando">Negociando</option>
    <option value="cliente">Cliente</option>
  </select>

  <textarea id="cNotes" placeholder="Notas"></textarea>

  <button onclick="createClient()">Salvar</button>
  <div id="crmMsg"></div>
</div>

<h2>Clientes</h2>
<div id="clients"></div>

<!-- MODAL EDITAR -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Editar Cliente</h3>

    <input id="eName">
    <input id="eEmail">
    <input id="ePhone">

    <select id="eStatus">
      <option value="lead">Lead</option>
      <option value="negociando">Negociando</option>
      <option value="cliente">Cliente</option>
    </select>

    <textarea id="eNotes"></textarea>

    <button onclick="saveEdit()">Salvar</button>
    <button class="btn-ghost" onclick="closeEdit()">Cancelar</button>
  </div>
</div>

<script>
const headers = {
  "Content-Type": "application/json",
  Authorization: "Bearer " + token
};

let editId = null;

async function loadClients() {
  const res = await fetch("/api/crm", { headers });
  const data = await res.json();

  const box = document.getElementById("clients");
  box.innerHTML = "";

  data.forEach(c => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${c.name}</b><br>
      ${c.email || ""}<br>
      ${c.phone || ""}<br>
      <small>Status: ${c.status}</small><br><br>

      <button onclick='openEdit(${JSON.stringify(c)})'>Editar</button>
      <button class="btn-ai" onclick="aiSuggest(${c.id})">IA 💡</button>
      <button class="btn-danger" onclick="deleteClient(${c.id})">Excluir</button>
    `;
    box.appendChild(div);
  });
}

async function createClient() {
  const body = {
    name: cName.value,
    email: cEmail.value,
    phone: cPhone.value,
    status: cStatus.value,
    notes: cNotes.value
  };

  const res = await fetch("/api/crm", {
    method: "POST",
    headers,
    body: JSON.stringify(body)
  });

  if (res.ok) {
    crmMsg.innerText = "Cliente salvo com sucesso!";
    crmMsg.style.color = "green";
    cName.value = cEmail.value = cPhone.value = cNotes.value = "";
    loadClients();
  }
}

function openEdit(c) {
  editId = c.id;
  eName.value = c.name;
  eEmail.value = c.email || "";
  ePhone.value = c.phone || "";
  eStatus.value = c.status;
  eNotes.value = c.notes || "";
  editModal.style.display = "flex";
}

function closeEdit() {
  editModal.style.display = "none";
}

async function saveEdit() {
  await fetch("/api/crm/" + editId, {
    method: "PUT",
    headers,
    body: JSON.stringify({
      name: eName.value,
      email: eEmail.value,
      phone: ePhone.value,
      status: eStatus.value,
      notes: eNotes.value
    })
  });

  closeEdit();
  loadClients();
}

async function deleteClient(id) {
  if (!confirm("Excluir este cliente?")) return;

  await fetch("/api/crm/" + id, {
    method: "DELETE",
    headers
  });

  loadClients();
}

/* IA */
async function aiSuggest(id) {
  const res = await fetch("/api/crm/ai/" + id, { headers });
  const data = await res.json();
  alert("💡 Sugestão da IA:\n\n" + data.text);
}

loadClients();
</script>

</body>
</html>
