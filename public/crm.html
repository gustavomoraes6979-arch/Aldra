<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CRM - Aldra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      padding: 20px;
      background: #f4f7fa;
      font-family: Arial, sans-serif;
    }

    h1, h2, h3 { color: #053F6B; }

    button {
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #053F6B;
      color: #fff;
      font-weight: bold;
    }

    .btn-danger { background: #c0392b; }
    .btn-ghost { background: #7f8c8d; }
    .btn-ai { background: #16a085; }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }

    .client {
      border-left: 4px solid #053F6B;
    }

    input, select, textarea {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #dce2e8;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    small { color: #666; }

    #msg {
      margin-top: 8px;
      font-size: 14px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>📊 CRM — Aldra</h1>

<script>
  const token = localStorage.getItem("token");
  if (!token) location.href = "/";
</script>

<button onclick="location.href='/dashboard.html'">← Voltar</button>

<!-- NOVO CLIENTE -->
<div class="card">
  <h3>Novo Cliente</h3>

  <input id="name" placeholder="Nome do cliente">
  <input id="email" placeholder="E-mail">
  <input id="phone" placeholder="Telefone">

  <select id="status">
    <option value="lead">Lead</option>
    <option value="negociando">Negociando</option>
    <option value="cliente">Cliente</option>
  </select>

  <textarea id="notes" placeholder="Observações"></textarea>

  <button onclick="createClient()">Salvar Cliente</button>
  <div id="msg"></div>
</div>

<h2>Clientes</h2>
<div id="clients"></div>

<!-- MODAL EDITAR -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Editar Cliente</h3>

    <input id="eName">
    <input id="eEmail">
    <input id="ePhone">

    <select id="eStatus">
      <option value="lead">Lead</option>
      <option value="negociando">Negociando</option>
      <option value="cliente">Cliente</option>
    </select>

    <textarea id="eNotes"></textarea>

    <button onclick="saveEdit()">Salvar</button>
    <button class="btn-ghost" onclick="closeEdit()">Cancelar</button>
  </div>
</div>

<script>
const headers = {
  "Content-Type": "application/json",
  Authorization: "Bearer " + token
};

let editId = null;

/* LISTAR */
async function loadClients() {
  const res = await fetch("/api/crm", { headers });
  const data = await res.json();

  const box = document.getElementById("clients");
  box.innerHTML = "";

  if (!data.length) {
    box.innerHTML = "<small>Nenhum cliente cadastrado.</small>";
    return;
  }

  data.forEach(c => {
    const div = document.createElement("div");
    div.className = "card client";
    div.innerHTML = `
      <b>${c.name}</b><br>
      ${c.email || ""}<br>
      ${c.phone || ""}<br>
      <small>Status: ${c.status}</small><br>
      <small>${c.notes || ""}</small><br><br>

      <button onclick='openEdit(${JSON.stringify(c)})'>Editar</button>
      <button class="btn-ai" onclick="aiSuggest(${c.id})">IA 💡</button>
      <button class="btn-danger" onclick="deleteClient(${c.id})">Excluir</button>
    `;
    box.appendChild(div);
  });
}

/* CRIAR */
async function createClient() {
  const body = {
    name: name.value.trim(),
    email: email.value.trim(),
    phone: phone.value.trim(),
    status: status.value,
    notes: notes.value.trim()
  };

  if (!body.name) {
    msg.style.color = "red";
    msg.innerText = "Nome é obrigatório";
    return;
  }

  const res = await fetch("/api/crm", {
    method: "POST",
    headers,
    body: JSON.stringify(body)
  });

  if (res.ok) {
    msg.style.color = "green";
    msg.innerText = "Cliente salvo com sucesso!";
    name.value = email.value = phone.value = notes.value = "";
    loadClients();
  } else {
    msg.style.color = "red";
    msg.innerText = "Erro ao salvar cliente";
  }
}

/* EDITAR */
function openEdit(c) {
  editId = c.id;
  eName.value = c.name;
  eEmail.value = c.email || "";
  ePhone.value = c.phone || "";
  eStatus.value = c.status;
  eNotes.value = c.notes || "";
  editModal.style.display = "flex";
}

function closeEdit() {
  editModal.style.display = "none";
}

async function saveEdit() {
  await fetch("/api/crm/" + editId, {
    method: "PUT",
    headers,
    body: JSON.stringify({
      name: eName.value,
      email: eEmail.value,
      phone: ePhone.value,
      status: eStatus.value,
      notes: eNotes.value
    })
  });

  closeEdit();
  loadClients();
}

/* EXCLUIR */
async function deleteClient(id) {
  if (!confirm("Excluir este cliente?")) return;

  await fetch("/api/crm/" + id, {
    method: "DELETE",
    headers
  });

  loadClients();
}

/* IA */
async function aiSuggest(id) {
  const res = await fetch("/api/crm/ai/" + id, { headers });
  const data = await res.json();
  alert("💡 Sugestão da IA:\n\n" + data.text);
}

loadClients();
</script>

</body>
</html>
