<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Aldra — Acesso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #053F6B, #0A66A3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #ffffff;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #053F6B;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #dce2e8;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      border: none;
      background: #053F6B;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: #053F6B;
      border: 1px solid #053F6B;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: red;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Aldra</h1>
    <p id="subtitle">Entre na sua conta</p>

    <input id="name" class="hidden" type="text" placeholder="Seu nome" />
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Senha" />

    <button id="mainBtn">Entrar</button>
    <button class="secondary" id="toggleBtn">Criar uma conta</button>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    let mode = "login";
    let loading = false;

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const msg = document.getElementById("msg");
    const subtitle = document.getElementById("subtitle");
    const mainBtn = document.getElementById("mainBtn");
    const toggleBtn = document.getElementById("toggleBtn");

    // 🔒 NÃO REDIRECIONA AUTOMATICAMENTE
    // Só entra se token for válido E assinatura ativa
    async function checkExistingSession() {
      const token = localStorage.getItem("token");
      if (!token) return;

      try {
        const res = await fetch("/subscription/status", {
          headers: {
            Authorization: "Bearer " + token
          }
        });

        if (!res.ok) {
          localStorage.removeItem("token");
          return;
        }

        const data = await res.json();

        if (data.subscription_status === "active") {
          window.location.replace("/dashboard.html");
        } else {
          localStorage.removeItem("token");
        }

      } catch (err) {
        localStorage.removeItem("token");
      }
    }

    // Executa após carregar tudo
    window.addEventListener("load", checkExistingSession);

    toggleBtn.onclick = () => {
      msg.innerText = "";

      if (mode === "login") {
        mode = "register";
        nameInput.classList.remove("hidden");
        subtitle.innerText = "Crie sua conta na Aldra";
        mainBtn.innerText = "Cadastrar";
        toggleBtn.innerText = "Já tenho conta";
      } else {
        mode = "login";
        nameInput.classList.add("hidden");
        subtitle.innerText = "Entre na sua conta";
        mainBtn.innerText = "Entrar";
        toggleBtn.innerText = "Criar uma conta";
      }
    };

    async function submit() {
      if (loading) return;
      loading = true;
      mainBtn.disabled = true;

      msg.style.color = "red";
      msg.innerText = "";

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const name = nameInput.value.trim();

      if (!email || !password || (mode === "register" && !name)) {
        msg.innerText = "Preencha todos os campos";
        loading = false;
        mainBtn.disabled = false;
        return;
      }

      try {
        const url = mode === "login" ? "/auth/login" : "/auth/register";

        const body =
          mode === "login"
            ? { email, password }
            : { name, email, password };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          msg.innerText = data.error || "Erro inesperado";
          return;
        }

        if (mode === "login") {
          localStorage.setItem("token", data.token);
          window.location.replace("/dashboard.html");
        } else {
          msg.style.color = "green";
          msg.innerText = "Conta criada com sucesso! Faça login.";
          toggleBtn.click();
        }

      } catch {
        msg.innerText = "Erro ao conectar com o servidor";
      } finally {
        loading = false;
        mainBtn.disabled = false;
      }
    }

    mainBtn.onclick = submit;

    [emailInput, passwordInput, nameInput].forEach(input => {
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") submit();
      });
    });
  </script>
</body>
</html>
