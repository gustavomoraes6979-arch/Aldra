<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Aldra — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #ffffff;
      padding: 32px;
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #053F6B;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #dce2e8;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0A6CBD;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #3BB273;
    }

    .error {
      color: red;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Aldra</h1>

    <input id="name" placeholder="Nome (apenas cadastro)" />
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Senha" />

    <button onclick="login()">Entrar</button>
    <button class="secondary" onclick="register()">Cadastrar</button>

    <div id="error" class="error"></div>
  </div>

<script>
/**
 * ==========================================
 * CADASTRO
 * ==========================================
 */
async function register() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");
  error.textContent = "";

  if (!name || !email || !password) {
    error.textContent = "Preencha nome, email e senha para cadastrar.";
    return;
  }

  try {
    const r = await fetch("/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Erro no cadastro");

    alert("Cadastro realizado! Agora faça login.");
  } catch (e) {
    error.textContent = e.message;
  }
}

/**
 * ==========================================
 * LOGIN + REDIRECIONAMENTO INTELIGENTE
 * ==========================================
 */
async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");
  error.textContent = "";

  if (!email || !password) {
    error.textContent = "Informe email e senha.";
    return;
  }

  try {
    const r = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Erro no login");

    // salva token
    localStorage.setItem("token", j.token);

    // 🔎 verifica assinatura
    const statusRes = await fetch("/subscription/status", {
      headers: {
        Authorization: "Bearer " + j.token
      }
    });

    const status = await statusRes.json();

    if (status.subscription_status === "active") {
      window.location.href = "/dashboard";
    } else {
      window.location.href = "/payment";
    }

  } catch (e) {
    error.textContent = e.message;
  }
}
</script>

</body>
</html>
