<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Aldra — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --azul-escuro:#053F6B;
  --azul:#0A6CBD;
  --verde:#3BB273;
  --bg:#F4F7FA;
  --borda:#DCE2E8;
  --white:#fff;
  --radius:14px;
  --shadow:0 10px 25px rgba(0,0,0,.06);
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

header{
  background:var(--white);
  padding:18px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--borda);
  box-shadow:var(--shadow);
}

header h1{
  margin:0;
  font-size:20px;
  color:var(--azul-escuro);
}

.header-actions{
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:var(--radius);
  padding:10px 16px;
  font-weight:600;
  cursor:pointer;
}

.btn-admin{
  background:#111;
  color:#fff;
}

.btn-logout{
  background:#e74c3c;
  color:white;
}

.alert{
  background:#fff3cd;
  color:#856404;
  border:1px solid #ffeeba;
  margin:25px;
  padding:24px;
  border-radius:var(--radius);
  font-weight:600;
  display:none;
}

.action{
  background:var(--verde);
  color:white;
  padding:12px 22px;
  margin-top:15px;
}

.menu{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:18px 28px;
  background:var(--white);
  border-bottom:1px solid var(--borda);
}

.menu button{
  background:var(--azul);
  color:white;
}

.section{
  background:var(--white);
  margin:30px;
  padding:30px;
  border-radius:var(--radius);
  border:1px solid var(--borda);
  box-shadow:var(--shadow);
  display:none;
}

.section.active{
  display:block;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:var(--radius);
  border:1px solid var(--borda);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--borda);
}

th{
  background:#f1f4f8;
}

.pix-box{
  margin-top:20px;
  background:white;
  padding:20px;
  border-radius:var(--radius);
  border:1px solid var(--borda);
  display:none;
}

.pix-box img{
  width:220px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🚀 Aldra — Plataforma Administrativa</h1>
  <div class="header-actions">

    <button class="btn-admin" onclick="window.location.href='/admin-auth.html'">
      🔐 Admin
    </button>

    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</header>

<!-- ALERTA ASSINATURA -->
<div id="alert" class="alert">
⚠️ Sua assinatura não está ativa.<br><br>

<button class="action" onclick="ativarPlano()">
Assinar Plano Mensal — R$ 70,00
</button>

<div class="pix-box" id="pixBox">
<h3>📲 Escaneie o QR Code</h3>
<img id="qrImage" />
<p><strong>Copia e Cola:</strong></p>
<textarea id="pixCode" readonly></textarea>
</div>
</div>

<!-- MENU -->
<div class="menu" id="menu">
<button onclick="showSection('PDF')">📄 PDF</button>
<button onclick="showSection('Contrato')">📝 Contrato</button>
<button onclick="showSection('Cobranca')">💳 Cobrança</button>
<button onclick="showSection('Relatorios')">📊 Relatórios</button>
<button onclick="showSection('Chat')">💬 Chat IA</button>
<button onclick="showSection('CRM')">👥 CRM</button>
</div>

<!-- SEÇÕES -->
<div id="sectionPDF" class="section active"><h2>📄 Análise de PDF</h2></div>
<div id="sectionContrato" class="section"><h2>📝 Gerador de Contratos</h2></div>
<div id="sectionCobranca" class="section"><h2>💳 Cobrança</h2></div>
<div id="sectionRelatorios" class="section"><h2>📊 Relatórios</h2></div>
<div id="sectionChat" class="section"><h2>💬 Chat IA</h2></div>

<div id="sectionCRM" class="section">
<h2>👥 CRM</h2>

<input id="crmNome" placeholder="Nome do cliente" />
<input id="crmEmail" placeholder="Email do cliente" />
<input id="crmTelefone" placeholder="Telefone" />
<button class="action" onclick="salvarCliente()">Salvar Cliente</button>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Email</th>
<th>Telefone</th>
</tr>
</thead>
<tbody id="crmLista"></tbody>
</table>

</div>

<script>

// ===============================
// PROTEÇÃO LOGIN
// ===============================
const token = localStorage.getItem("token");
if(!token){
  window.location.href="/";
}

// ===============================
// LOGOUT
// ===============================
function logout(){
  localStorage.removeItem("token");
  window.location.href="/";
}

// ===============================
// MOSTRAR SEÇÕES
// ===============================
function showSection(name){
  document.querySelectorAll(".section").forEach(sec=>{
    sec.classList.remove("active");
  });
  document.getElementById("section"+name).classList.add("active");
}

// ===============================
// VERIFICAR ASSINATURA AO ENTRAR
// ===============================
async function verificarAssinatura(){

  try{
    const res = await fetch("/subscription/status",{
      headers:{ Authorization:"Bearer "+token }
    });

    const data = await res.json();

    const status = data.status;

    if(status === "approved"){
      document.getElementById("alert").style.display="none";
      return;
    }

    if(["pending","in_process","authorized"].includes(status)){
      document.getElementById("alert").style.display="block";
      document.getElementById("pixBox").style.display="block";

      if(data.qr){
        document.getElementById("qrImage").src = data.qr;
      }

      if(data.pixCode){
        document.getElementById("pixCode").value = data.pixCode;
      }
      return;
    }

    document.getElementById("alert").style.display="block";

  }catch(e){
    console.log("Erro ao verificar assinatura");
  }
}

verificarAssinatura();

// ===============================
// ATIVAR PLANO
// ===============================
async function ativarPlano(){

  const res = await fetch("/subscription/create",{
    method:"POST",
    headers:{ Authorization:"Bearer "+token }
  });

  const data = await res.json();

  if(data.qr){
    document.getElementById("alert").style.display="block";
    document.getElementById("pixBox").style.display="block";
    document.getElementById("qrImage").src = data.qr;
    document.getElementById("pixCode").value = data.pixCode;
  }
}

</script>

</body>
</html>
