<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>Aldra — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

:root{
--azul-escuro:#053F6B;
--azul:#0A6CBD;
--verde:#3BB273;
--bg:#F4F7FA;
--borda:#DCE2E8;
--white:#fff;
--radius:14px;
--shadow:0 10px 25px rgba(0,0,0,.06);
}

body{
margin:0;
background:var(--bg);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
}

header{
background:var(--white);
padding:18px 32px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid var(--borda);
}

.menu{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:15px;
background:var(--white);
}

.menu button{
background:var(--azul);
color:#fff;
}

.section{
display:none;
background:var(--white);
margin:20px;
padding:25px;
border-radius:var(--radius);
}

.section.active{
display:block;
}

input{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:8px;
border-radius:8px;
border:1px solid var(--borda);
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
}

.action{
background:var(--verde);
color:#fff;
margin-top:10px;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

.alert{
display:none;
margin:20px;
padding:20px;
background:#fff3cd;
border-radius:10px;
}

.pix-box{
display:none;
margin-top:20px;
}

</style>

</head>

<body>

<header>
<h1>🚀 Aldra</h1>

<div>
<button id="adminBtn" style="display:none;">Admin</button>
<button onclick="logout()">Sair</button>
</div>

</header>

<!-- ALERTA -->

<div id="alert" class="alert">
⚠️ Assinatura inativa

<button onclick="ativarPlano()" class="action">
Ativar Plano R$1
</button>

<div id="pixBox" class="pix-box">
<img id="qrImage">
<textarea id="pixCode"></textarea>
</div>

</div>

<!-- MENU -->

<div class="menu">
<button onclick="showSection('CRM')">CRM</button>
<button onclick="showSection('Estoque')">Estoque</button>
<button onclick="showSection('Financeiro')">Financeiro</button>
</div>

<!-- ================= CRM ================= -->

<div id="sectionCRM" class="section">

<h2>CRM</h2>

<input id="crmNome" placeholder="Nome">
<input id="crmEmail" placeholder="Email">
<input id="crmTelefone" placeholder="Telefone">

<button class="action" onclick="salvarCliente()">
Adicionar Cliente
</button>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Email</th>
<th>Telefone</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="crmLista"></tbody>
</table>

</div>

<!-- ================= ESTOQUE ================= -->

<div id="sectionEstoque" class="section">

<h2>Estoque</h2>

<input id="prodNome" placeholder="Produto">
<input id="prodSku" placeholder="SKU">
<input id="prodQtd" placeholder="Quantidade">
<input id="prodPreco" placeholder="Preço">

<button class="action" onclick="addProduto()">
Adicionar Produto
</button>

<table>
<thead>
<tr>
<th>Produto</th>
<th>SKU</th>
<th>Qtd</th>
<th>Preço</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="estoqueLista"></tbody>
</table>

</div>

<!-- ================= FINANCEIRO ================= -->

<div id="sectionFinanceiro" class="section">

<h2>Financeiro</h2>

<input id="finDesc" placeholder="Descrição">
<input id="finTipo" placeholder="Tipo (entrada/saida)">
<input id="finValor" placeholder="Valor">

<button class="action" onclick="addConta()">
Adicionar Conta
</button>

<table>
<thead>
<tr>
<th>Descrição</th>
<th>Tipo</th>
<th>Valor</th>
<th>Status</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="financeiroLista"></tbody>
</table>

</div>

<script src="/js/dashboard.js"></script>

</body>
</html>
