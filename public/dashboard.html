<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Aldra — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --azul-escuro: #053F6B;
      --azul-principal: #0A6CBD;
      --verde-aldra: #3BB273;
      --cinza-bg: #F4F7FA;
      --cinza-borda: #DCE2E8;
      --white: #ffffff;
      --radius: 12px;
      --shadow: 0 6px 16px rgba(5, 25, 45, 0.08);
    }

    body {
      margin: 0;
      background: var(--cinza-bg);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--white);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cinza-borda);
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 20px;
      color: var(--azul-escuro);
      margin: 0;
    }

    header button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
    }

    .alert {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
      margin: 20px;
      padding: 14px 20px;
      border-radius: var(--radius);
      font-weight: 600;
      display: none;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 20px;
      background: var(--white);
      border-bottom: 1px solid var(--cinza-borda);
    }

    .menu button {
      padding: 10px 18px;
      background: var(--azul-principal);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
    }

    .section {
      background: var(--white);
      margin: 28px;
      padding: 28px;
      border-radius: var(--radius);
      border: 1px solid var(--cinza-borda);
      box-shadow: var(--shadow);
      display: none;
    }

    .section.active {
      display: block;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--cinza-borda);
    }

    .action {
      background: var(--verde-aldra);
      color: white;
      padding: 12px 22px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      margin-top: 14px;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--cinza-borda);
      text-align: left;
    }

    th {
      background: #f1f4f8;
    }
  </style>
</head>

<body>

<header>
  <h1>Aldra — Plataforma Administrativa</h1>
  <button onclick="logout()">Sair</button>
</header>

<div id="alert" class="alert">
  ⚠️ Sua assinatura ainda não está ativa.
</div>

<div class="menu">
  <button onclick="showSection('PDF')">📄 Análise de PDF</button>
  <button onclick="showSection('Contrato')">📝 Gerar Contrato</button>
  <button onclick="showSection('Cobranca')">💳 Cobrança</button>
  <button onclick="showSection('Relatorios')">📊 Relatórios</button>
  <button onclick="showSection('Chat')">💬 Chat IA</button>
  <button onclick="showSection('CRM')">👥 CRM</button>
</div>

<!-- SEÇÕES -->

<div id="sectionPDF" class="section">
  <h2>📄 Análise de PDF</h2>
</div>

<div id="sectionContrato" class="section">
  <h2>📝 Gerador de Contratos</h2>
</div>

<div id="sectionCobranca" class="section">
  <h2>💳 Cobrança</h2>
</div>

<div id="sectionRelatorios" class="section">
  <h2>📊 Relatórios</h2>
</div>

<div id="sectionChat" class="section">
  <h2>💬 Chat Inteligente</h2>
</div>

<div id="sectionCRM" class="section">
  <h2>👥 CRM</h2>
  <input id="crmNome" placeholder="Nome do cliente">
  <input id="crmEmail" placeholder="E-mail">
  <input id="crmTelefone" placeholder="Telefone">
  <button class="action" onclick="salvarCliente()">Salvar Cliente</button>

  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Telefone</th>
      </tr>
    </thead>
    <tbody id="crmLista"></tbody>
  </table>
</div>

<script>
  // ===============================
  // 🔐 PROTEÇÃO DO DASHBOARD
  // ===============================

  const urlParams = new URLSearchParams(window.location.search);
  const tokenFromUrl = urlParams.get("token");

  if (tokenFromUrl) {
    localStorage.setItem("token", tokenFromUrl);
    window.history.replaceState({}, document.title, "/dashboard.html");
  }

  const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "/";
  }

  // ===============================
  // LOGOUT
  // ===============================

  function logout() {
    localStorage.removeItem("token");
    window.location.href = "/";
  }

  // ===============================
  // MENU
  // ===============================

  function showSection(name) {
    document.querySelectorAll(".section").forEach(sec =>
      sec.classList.remove("active")
    );

    document.getElementById("section" + name).classList.add("active");
  }

  showSection("PDF");
</script>

<script src="/js/dashboard.js"></script>

</body>
</html>
