<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Aldra — Painel Administrativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --azul:#0A6CBD;
  --azul-escuro:#053F6B;
  --verde:#3BB273;
  --vermelho:#c0392b;
  --bg:#F4F7FA;
  --borda:#E3E8EE;
  --white:#fff;
  --radius:14px;
  --shadow:0 12px 30px rgba(0,0,0,.05);
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

header{
  background:var(--white);
  padding:18px 32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--borda);
  box-shadow:var(--shadow);
}

header h1{
  margin:0;
  font-size:20px;
  color:var(--azul-escuro);
}

.header-actions{
  display:flex;
  gap:10px;
}

button{
  border:none;
  border-radius:10px;
  padding:8px 14px;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{
  background:var(--azul);
  color:white;
}

.btn-danger{
  background:var(--vermelho);
  color:white;
}

.btn-secondary{
  background:#111;
  color:white;
}

.container{
  padding:35px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:var(--white);
  padding:25px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card p{
  margin:0;
  color:#666;
  font-weight:600;
}

.card h2{
  margin-top:10px;
  font-size:28px;
  color:var(--azul);
}

table{
  width:100%;
  background:var(--white);
  border-collapse:collapse;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}

th,td{
  padding:14px;
  text-align:left;
  font-size:14px;
  border-bottom:1px solid var(--borda);
}

th{
  background:var(--azul);
  color:white;
}

.status-active{ color:green;font-weight:bold; }
.status-pending{ color:#e69500;font-weight:bold; }
.status-blocked{ color:red;font-weight:bold; }

.actions button{
  margin-right:6px;
}
</style>
</head>

<body>

<header>
  <h1>👑 Aldra — Painel Administrativo</h1>
  <div class="header-actions">
    <button class="btn-secondary" onclick="voltarDashboard()">Dashboard</button>
    <button class="btn-danger" onclick="logout()">Sair</button>
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="card">
      <p>Total de Usuários</p>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="card">
      <p>Assinaturas Ativas</p>
      <h2 id="activeUsers">0</h2>
    </div>
    <div class="card">
      <p>Pendentes</p>
      <h2 id="pendingUsers">0</h2>
    </div>
    <div class="card">
      <p>Receita Mensal</p>
      <h2 id="monthlyRevenue">R$ 0</h2>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>

</div>

<script>
const token = localStorage.getItem("token");
const isAdmin = localStorage.getItem("isAdmin");

// 🔒 BLOQUEIO INICIAL
if(!token || !isAdmin){
  alert("Acesso não autorizado.");
  window.location.href="/dashboard.html";
}

// ===============================
// VALIDAÇÃO REAL VIA BACKEND
// ===============================
async function validarAdmin(){

  try{

    const res = await fetch("/api/me",{
      headers:{ Authorization:"Bearer "+token }
    });

    if(res.status === 401){
      logout();
      return;
    }

    const data = await res.json();

    if(!data.isAdmin){
      alert("Acesso restrito ao administrador.");
      localStorage.removeItem("isAdmin");
      window.location.href="/dashboard.html";
      return;
    }

  }catch{
    logout();
  }
}

validarAdmin();

// ===============================
// LOGOUT TOTAL
// ===============================
function logout(){
  localStorage.removeItem("token");
  localStorage.removeItem("isAdmin");
  window.location.href="/";
}

function voltarDashboard(){
  localStorage.removeItem("isAdmin");
  window.location.href="/dashboard.html";
}
</script>

<script src="/admin.js"></script>

</body>
</html>
