<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aldra — Assinatura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      color: #0A6CBD;
      margin: 20px 0;
    }

    #qrcode img {
      margin: 20px auto;
      width: 220px;
    }

    .pix-box {
      background: #eef4ff;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 13px;
      word-break: break-all;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
      color: #0A6CBD;
    }

    .alert {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #0A6CBD;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🔐 Assinatura Aldra</h1>
  <p>Ative sua assinatura mensal</p>

  <div class="price">R$ 70,00 / mês</div>

  <div id="qrcode"></div>

  <div class="pix-box" id="pixCode"></div>

  <button onclick="gerarPix()">Gerar PIX</button>

  <div class="status" id="statusMsg">
    ⏳ Aguardando pagamento
  </div>

  <div class="alert">
    Após o pagamento, a liberação ocorre automaticamente.
  </div>
</div>

<script>
/* ======================================================
   SEGURANÇA
====================================================== */

const token = localStorage.getItem("token");
if (!token) {
  window.location.href = "/";
}

const qrContainer = document.getElementById("qrcode");
const pixCodeEl = document.getElementById("pixCode");
const statusMsg = document.getElementById("statusMsg");

/* ======================================================
   SAFE JSON
====================================================== */
async function safeJson(res) {
  try {
    const text = await res.text();
    if (!text || text.trim().startsWith("<")) return {};
    return JSON.parse(text);
  } catch {
    return {};
  }
}

/* ======================================================
   GERAR PIX REAL VIA BACKEND
====================================================== */
async function gerarPix() {

  qrContainer.innerHTML = "";
  pixCodeEl.innerText = "";
  statusMsg.innerText = "⏳ Gerando PIX...";

  try {

    const res = await fetch("/subscription/create", {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token
      }
    });

    if (!res.ok) {
      statusMsg.innerText = "❌ Erro ao gerar pagamento.";
      return;
    }

    const data = await safeJson(res);

    const pixData =
      data?.point_of_interaction?.transaction_data ||
      data?.transaction_data;

    if (!pixData) {
      statusMsg.innerText = "❌ Erro ao gerar PIX.";
      return;
    }

    if (pixData.qr_code_base64) {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + pixData.qr_code_base64;
      qrContainer.appendChild(img);
    }

    if (pixData.qr_code) {
      pixCodeEl.innerText = pixData.qr_code;
    }

    statusMsg.innerText = "⏳ Aguardando pagamento...";

  } catch (err) {
    console.error(err);
    statusMsg.innerText = "❌ Erro ao gerar pagamento.";
  }
}

/* ======================================================
   VERIFICAR STATUS REAL PELO BANCO
====================================================== */
async function verificarStatus() {
  try {

    const res = await fetch("/auth/me", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    if (!res.ok) return;

    const data = await safeJson(res);

    if (data.subscription_status === "active") {
      statusMsg.innerText = "✅ Pagamento confirmado!";
      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 1500);
    }

  } catch (e) {
    console.log("Aguardando confirmação...");
  }
}

setInterval(verificarStatus, 5000);
</script>

</body>
</html>
